<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>{{.Title}} · 简记</title>
<style>
:root {color-scheme:light;--paper:#fff;--text:#292a27;--body:#50514b;--muted:#999a92;--line:#ecece7;--soft:#f4f4f1;--accent:#d3b553;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#181818;--text:#eee;--body:#ccc;--muted:#999;--line:#333;--soft:#252525;--accent:#aaa}}
*{box-sizing:border-box}input[type=checkbox]{accent-color:var(--accent)}::selection{background:var(--soft);color:var(--text)}body{margin:0;background:var(--paper);color:var(--text)}header{display:flex;justify-content:space-between;gap:16px;padding:20px max(24px,calc((100vw - 840px)/2));border-bottom:1px solid var(--line);font-size:13px}header span:last-child{color:var(--muted)}main{max-width:840px;margin:auto;padding:44px 24px 72px}h1{font-size:clamp(28px,4vw,36px);margin:0 0 28px;overflow-wrap:anywhere}.markdown{color:var(--body);line-height:1.85;overflow-wrap:anywhere}.markdown h1,.markdown h2,.markdown h3{color:var(--text)}.markdown img{display:block;max-width:100%;height:auto;border-radius:6px}.markdown pre{overflow:auto;padding:16px;border-radius:6px;background:var(--soft)}.markdown code{background:var(--soft);padding:2px 4px;border-radius:3px}.markdown pre code{padding:0}.markdown blockquote{margin-left:0;padding-left:16px;border-left:3px solid var(--accent);color:var(--muted)}.markdown a{color:inherit;text-decoration:underline}.markdown table{display:block;overflow:auto;border-collapse:collapse}.markdown td,.markdown th{border:1px solid var(--line);padding:6px 12px}.markdown hr{border:0;border-top:1px solid var(--line)}footer{border-top:1px solid var(--line);padding-top:20px;margin-top:48px;font-size:12px;color:var(--muted)}@media(max-width:600px){header{padding:16px 20px}main{padding:30px 20px 50px}header span:last-child{font-size:12px}}
</style>
</head>
<body>
<header><span>简记</span><span>只读分享</span></header>
<main><h1>{{.Title}}</h1><article class="markdown">{{.Body}}</article><footer>有效期至 {{.Expires}}</footer></main>
</body>
</html>
