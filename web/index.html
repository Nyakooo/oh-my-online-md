<!doctype html>
<html lang="zh-CN">
<head>
<link rel="icon" href="/favicon.svg?v=cat-note" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico?v=cat-note" sizes="16x16 32x32 48x48 64x64">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>简记 · Markdown</title>
  <script src="/theme-init.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --page: #f4f4f1;
      --sidebar: #f7f7f4;
      --paper: #fff;
      --text: #292a27;
      --body-text: #50514b;
      --muted: #999a92;
      --line: #ecece7;
      --hover: #efefeb;
      --accent: #f2ca55;
      --accent-soft: #fff5d5;
      --accent-text: #55481e;
      --danger: #b34237;
      --plus-ink: #51441b;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --page: #111111;
      --sidebar: #151515;
      --paper: #1b1b1b;
      --text: #eeeeee;
      --body-text: #c8c8c8;
      --muted: #909090;
      --line: #303030;
      --hover: #262626;
      --accent: #c8c8c8;
      --accent-soft: #2c2c2c;
      --accent-text: #e2e2e2;
      --danger: #dddddd;
      --plus-ink: #181818;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) {
        color-scheme: dark;
        --page: #111111;
        --sidebar: #151515;
        --paper: #1b1b1b;
        --text: #eeeeee;
        --body-text: #c8c8c8;
        --muted: #909090;
        --line: #303030;
        --hover: #262626;
        --accent: #c8c8c8;
        --accent-soft: #2c2c2c;
        --accent-text: #e2e2e2;
        --danger: #dddddd;
        --plus-ink: #181818;
      }
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; color: var(--text); background: var(--page); }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    ::selection { background: var(--accent-soft); color: var(--text); }
    input[type="checkbox"] { accent-color: var(--accent); }
    .app { display: grid; grid-template-columns: 276px minmax(0, 1fr); width: 100%; height: 100dvh; min-height: 500px; margin: 0 auto; overflow: hidden; background: var(--paper); }
    aside { display: flex; min-width: 0; flex-direction: column; padding: 25px 17px 16px; background: var(--sidebar); }
    .new-note { display: flex; align-items: center; gap: 10px; width: 100%; margin: 27px 0; padding: 11px 12px; border: 0; border-radius: 10px; color: var(--accent-text); background: var(--accent-soft); text-align: left; font-size: 13px; font-weight: 550; transition: background .15s ease; }
    .new-note:hover { filter: brightness(.97); }
    .plus { display: grid; width: 20px; height: 20px; place-items: center; border-radius: 50%; background: var(--accent); color: var(--plus-ink); font-size: 16px; line-height: 1; }
    .note-search { width: 100%; flex: none; margin: -10px 0 22px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; outline: none; background: transparent; color: var(--text); font: inherit; font-size: 13px; }
    .note-search::placeholder { color: var(--muted); }
    .note-search:focus { border-color: var(--muted); }
    .note-snippet { font-size: 12px; line-height: 1.6; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .note-item mark { color: var(--text); background: var(--accent-soft); }
    .section-label { margin: 0 9px 10px; color: var(--muted); font-size: 12px; font-weight: 550; }
    .note-list { display: flex; min-height: 0; flex-direction: column; gap: 3px; overflow-y: auto; }
    .note-item { display: flex; width: 100%; flex-direction: column; gap: 4px; border: 0; border-radius: 9px; padding: 10px 11px; color: var(--body-text); background: transparent; text-align: left; }
    .note-item:hover { background: var(--hover); }
    .note-item.active { color: var(--text); background: var(--hover); }
    .note-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 550; }
    .note-date { color: var(--muted); font-size: 11px; }
    .empty-list { padding: 12px 9px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    main { display: flex; min-width: 0; min-height: 0; flex-direction: column; background: var(--paper); }
    .topbar { display: flex; min-height: 60px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 25px; border-bottom: 1px solid var(--line); }
    .crumb { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; flex: none; align-items: center; gap: 10px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .save-button[data-state="saved"] { color: var(--body-text); }
    .save-button[data-state="error"] { color: var(--danger); }
    .save-spinner { display: inline-block; width: 13px; height: 13px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .save-spinner { animation: none; } }
    .notice { position: fixed; z-index: 20; bottom: 24px; left: 50%; transform: translateX(-50%); max-width: min(90vw, 540px); padding: 10px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; color: var(--danger); font-size: 13px; box-shadow: 0 5px 24px #0002; }
    .note-menu { position: fixed; z-index: 10; min-width: 130px; padding: 5px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 30px #0002; }
    .note-menu button { display: block; width: 100%; border: 0; padding: 8px 12px; text-align: left; font: inherit; font-size: 13px; color: var(--body-text); background: transparent; border-radius: 5px; }
    .note-menu button:hover { background: var(--hover); }
    .note-menu #delete-note { color: var(--danger); }
    .save-button { min-width: 54px; border: 0; border-radius: 7px; padding: 7px 12px; color: var(--accent-text); background: var(--accent-soft); font-size: 12px; font-weight: 550; }
    .save-button:hover { filter: brightness(.97); }
    .icon-button { display: grid; width: 31px; height: 31px; place-items: center; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-size: 16px; }
    .icon-button:hover { color: var(--text); background: var(--hover); }
    #theme-toggle, #share-note { width: 36px; height: 36px; }
    #theme-toggle svg, #share-note svg { width: 17px; height: 17px; }
    #theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon-button:disabled { opacity: .4; cursor: default; }
    .icon-button:disabled:hover { color: var(--muted); background: transparent; }
    .editor-pane { min-width: 0; min-height: 0; flex: 1; overflow: auto; padding: 30px 36px 38px; }
    .title-input { display: block; width: 100%; margin: 0 0 20px; padding: 0; border: 0; outline: 0; color: var(--text); background: transparent; font-size: clamp(26px, 3.2vw, 35px); font-weight: 650; letter-spacing: -.045em; }
    .title-input::placeholder { color: var(--muted); opacity: .65; }
    [hidden] { display: none !important; }
    .app[data-loading="true"]:not([data-loading-scope="note"]) [data-note-action],
    .app[data-loading="true"]:not([data-loading-scope="note"]) .crumb { visibility: hidden; pointer-events: none; }
    .app[data-loading="true"]:not([data-loading-scope="note"]) #note-list { opacity: .35; pointer-events: none; }

    #content { min-height: 55vh; }
    .rendered-block { cursor: text; padding: 2px 0; white-space: normal; }
    .rendered-block > :first-child { margin-top: 0; }
    .rendered-block > :last-child { margin-bottom: 0; }
    .markdown { min-width: 0; overflow-wrap: anywhere; color: var(--body-text); font-size: 15px; line-height: 1.8; }
    .markdown > :first-child { margin-top: 0; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 { color: var(--text); line-height: 1.4; }
    .markdown h1 { font-size: 2em; } .markdown h2 { font-size: 1.5em; }
    .markdown img, .markdown video { display: block; max-width: 100% !important; border-radius: 6px; }
    .markdown img:not([height]), .markdown video:not([height]) { height: auto; }
    .markdown pre { white-space: pre; padding: 14px; overflow: auto; background: var(--hover); border-radius: 6px; }
    .markdown code { background: var(--hover); border-radius: 3px; padding: 2px 4px; font-size: .9em; }
    .markdown pre code { padding: 0; }
    .markdown blockquote { margin-left: 0; padding-left: 16px; border-left: 3px solid var(--accent); color: var(--muted); }
    .markdown table { display: block; overflow: auto; border-collapse: collapse; }
    .markdown th, .markdown td { border: 1px solid var(--line); padding: 6px 12px; }
    .markdown a { color: var(--accent-text); text-decoration: underline; }
    .markdown hr { border: 0; border-top: 1px solid var(--line); }

    .editor-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding: 8px; background: var(--sidebar); border-radius: 10px 10px 0 0; }
    #content { border: 1px solid var(--line); border-radius: 10px; }
    .editor-toolbar button, .diagram-tools button { border: 0; border-radius: 5px; background: transparent; color: var(--body-text); padding: 7px 9px; font-size: 13px; }
    .editor-toolbar button:hover, .diagram-tools button:hover { background: var(--hover); }
    .editor-toolbar [aria-selected="true"] { background: var(--paper); color: var(--text); box-shadow: 0 1px 3px #0001; }
    .format-tools { display: flex; flex-wrap: wrap; gap: 2px; margin-left: auto; }
    .format-tools button { position: relative; display: grid; place-items: center; width: 32px; height: 32px; padding: 6px; color: var(--body-text); cursor: pointer; }
    .format-tools svg { width: 19px; height: 19px; }
    .format-tools .tool-group-start { margin-left: 9px; }
    .format-tools .tool-group-start::before { content: ""; position: absolute; left: -6px; top: 7px; height: 18px; width: 1px; background: var(--line); }
    .format-tools button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .format-tools button::after { content: attr(data-tooltip); position: absolute; top: calc(100% + 7px); right: 0; z-index: 20; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--text); box-shadow: 0 3px 12px #0002; font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: none; transform: translateX(var(--tooltip-shift, 0px)); }
    .format-tools button:hover::after, .format-tools button:focus-visible::after { opacity: 1; }
    #preview-panel { padding: 20px; min-height: 45vh; }
    .preview-empty { color: var(--muted); }
    .diagram { border: 1px solid var(--line); border-radius: 8px; margin: 16px 0; overflow: hidden; }
    .diagram-tools { display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 4px; background: var(--sidebar); font-size: 12px; }
    .diagram-viewport { overflow: auto; max-height: 70vh; padding: 16px; }
    .diagram-canvas { width: max-content; min-width: 100%; }
    .diagram-canvas svg { display: block; margin: auto; }
    .diagram-status { padding: 0 16px; font-size: 13px; color: var(--muted); }
    main { position: relative; }
    .loading-panel { position: absolute; z-index: 4; inset: 60px 0 0; display: grid; align-content: center; justify-items: center; gap: 18px; background: var(--paper); color: var(--muted); font-size: 13px; }
    .loading-orbit { width: 36px; height: 36px; border-radius: 12px; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 1.4s ease-in-out infinite; }
    .loading-lines { width: min(320px, 65%); display: grid; gap: 12px; margin-top: 12px; }
    .loading-lines i { display: block; height: 9px; border-radius: 8px; background: linear-gradient(100deg, var(--hover) 25%, var(--line) 45%, var(--hover) 65%); background-size: 250% 100%; animation: shimmer 1.6s ease infinite; }
    .loading-lines i:last-child { width: 65%; }
    @keyframes shimmer { to { background-position: -180% 0; } }
    @media (prefers-reduced-motion: reduce) { .loading-orbit, .loading-lines i { animation: none; } }
    @media (max-width: 760px) { .loading-panel { top: 55px; } .format-tools { margin-left: 0; } }

    .mobile-menu { display: none; }
    #sidebar-toggle { flex: none; }
    #sidebar-toggle svg { width: 19px; height: 19px; }
    @media (min-width: 761px) {
      html[data-sidebar-collapsed="true"] .app { grid-template-columns: 64px minmax(0, 1fr); }

      .crumb { margin-right: auto; }
    }


    .unsaved-dialog { width: min(420px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 13px; padding: 22px; color: var(--text); background: var(--paper); box-shadow: 0 20px 80px #0002; }
    .unsaved-dialog::backdrop { background: #20202066; }
    .unsaved-dialog h2 { margin: 0 0 8px; font-size: 17px; }
    .unsaved-dialog p { margin: 0 0 20px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .dialog-actions button { border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; color: var(--body-text); background: var(--paper); font-size: 12px; }
    .dialog-actions .primary { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
    .dialog-actions .discard { color: var(--danger); }
    .media-dialog label { display: grid; gap: 6px; margin-bottom: 14px; font-size: 13px; }
    .media-dialog input { width: 100%; min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); background: var(--paper); }
    .media-dimensions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .media-dialog .media-error { color: var(--danger); }
    .share-dialog { width: min(420px, calc(100vw - 32px)); }
    .share-dialog header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .share-dialog header h2 { margin: 0; }
    .share-dialog .icon-button { font-size: 20px; }
    .share-field { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 20px 0; color: var(--body-text); font-size: 13px; }
    .share-field select { font: inherit; padding: 7px 30px 7px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); background: var(--paper); }
    .share-link-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .share-link-row input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 8px; color: var(--body-text); background: var(--paper); font-size: 12px; }
    .share-link-row button { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; color: var(--text); background: var(--paper); white-space: nowrap; font-size: 12px; }
    .share-dialog #share-expiry { margin: 0 0 20px; font-size: 12px; }
    .share-dialog #share-error { color: var(--danger); margin-bottom: 16px; }
    .share-dialog button:disabled { opacity: .5; cursor: default; }
    @media (max-width: 760px) {
      .app { display: block; min-height: 0; }
      aside { display: none; }
      aside.open { position: fixed; z-index: 5; inset: 0 auto 0 0; display: flex; width: min(82vw, 310px); box-shadow: 0 0 0 100vmax #0005; }
      main { height: 100dvh; }
      .topbar { min-height: 55px; padding: 0 14px; }
      .mobile-menu { display: grid; }
      #sidebar-toggle { display: none; }
      .crumb { display: none; }
      .actions { gap: 7px; }
      .editor-pane { padding: 34px 24px 50px; }

    }
    @media (max-width: 390px) { .editor-pane { padding-right: 18px; padding-left: 18px; } }

    .new-actions { display:flex; align-items:center; gap:8px; margin:0 0 27px; }
    .new-actions .new-note { margin:0; flex:1; }
    #new-folder { flex:none; width:35px; height:35px; color:var(--body-text); }
    .folder-icon { width:17px; height:17px; flex:none; vertical-align:middle; }
    .note-item { flex-direction:row; align-items:flex-start; gap:9px; cursor:grab; }
    .note-item > .folder-icon { margin-top:1px; color:var(--muted); width:16px; height:16px; }
    .note-details { display:flex; flex-direction:column; min-width:0; gap:4px; flex:1; }
    .folder-group { flex:none; }
    .folder-row { display:flex; align-items:center; border-radius:8px; }
    .folder-row:hover { background:var(--hover); }
    .folder-toggle { display:flex; align-items:center; min-width:0; gap:8px; flex:1; padding:11px 3px 11px 7px; border:0; background:transparent; color:var(--body-text); font-size:13px; text-align:left; }
    .folder-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .folder-chevron { display:flex; color:var(--muted); }
    .folder-chevron .folder-icon { width:11px; height:11px; transition:transform .15s; }
    .folder-chevron.expanded .folder-icon { transform:rotate(90deg); }
    .folder-symbol { display:flex; color:#aa9658; }
    .folder-symbol .folder-icon { width:19px; height:19px; }
    .folder-toggle>.icon-lock { width:13px; height:13px; color:var(--muted); }
    .folder-settings { width:29px; height:29px; margin-right:3px; flex:none; }
    .folder-children { border-left:1px solid var(--line); margin:0 0 6px 19px; padding-left:9px; }
    .folder-empty { padding:10px 5px; color:var(--muted); font-size:11px; }
    .folder-root-drop { flex:none; margin:16px 0 0; border:1px dashed var(--line); border-radius:8px; padding:12px 5px; text-align:center; color:var(--muted); font-size:11px; }
    .folder-dropover, .dragging-note .folder-root-drop { background:var(--accent-soft); outline:1px dashed var(--accent); }
    .folder-dialog label { display:block; margin:18px 0 7px; color:var(--body-text); font-size:13px; }
    .folder-dialog input:not([type="checkbox"]), .folder-dialog select { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--text); font:inherit; }
    .folder-dialog .folder-check { display:flex; align-items:center; gap:8px; }
    .folder-dialog p { margin:12px 0 20px; font-size:12px; }
    .folder-dialog #folder-error { margin-bottom:0; color:var(--danger); }
    .folder-dialog .dialog-actions { margin-top:20px; gap:10px; }
    .folder-dialog .dialog-actions button { min-width:72px; min-height:36px; padding:8px 16px; }
    .folder-dialog #folder-show-password, .folder-lock-button { padding:8px 0; background:transparent; color:var(--body-text); border:0; font-size:12px; }
    .folder-dialog button:disabled { opacity:.5; cursor:default; }
    .folder-locked-panel { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:30px; color:var(--muted); text-align:center; }
    .folder-locked-panel h2 { color:var(--text); font-size:20px; margin:0; }
    .folder-locked-panel p { max-width:400px; font-size:13px; line-height:1.8; margin:0; }
    .folder-sort-before { box-shadow:0 -2px 0 var(--accent); }
    .folder-sort-after { box-shadow:0 2px 0 var(--accent); }
    .folder-row[draggable="true"] { cursor:grab; }
    .folder-lock-now { width:25px; height:28px; flex:none; color:var(--muted); }

    html[data-theme="dark"] { --page:#111; --sidebar:#181916; --paper:#1c1d19; --text:#eeefe6; --body-text:#c8cbbc; --muted:#999d8a; --line:#34362d; --hover:#2b2e24; --accent:#d5c386; --accent-soft:#373324; --accent-text:#e9dca8; }
    @media (prefers-color-scheme:dark) { html:not([data-theme]) { --page:#111; --sidebar:#181916; --paper:#1c1d19; --text:#eeefe6; --body-text:#c8cbbc; --muted:#999d8a; --line:#34362d; --hover:#2b2e24; --accent:#d5c386; --accent-soft:#373324; --accent-text:#e9dca8; } }
    .app { transition:grid-template-columns .28s cubic-bezier(.2,.85,.3,1); }
    .new-note { border-radius:14px; box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 25%,transparent); }
    .save-button { border-radius:11px; box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 20%,transparent); }
    .note-item { border-radius:12px; }
    .note-search { border-radius:12px; }
    #content { border-radius:18px; }
    .editor-toolbar { border-radius:17px 17px 0 0; }
    .editor-toolbar button { border-radius:9px; }
    .markdown pre { border-radius:12px; }
    .sidebar-rail { display:none; }
    .rail-button { display:grid; place-items:center; flex:none; width:44px; height:42px; padding:0; border:0; border-radius:15px; color:var(--muted); background:transparent; transition:background .15s; }
    .rail-button svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; transition:transform .24s cubic-bezier(.2,1.4,.4,1); }
    .rail-button:hover { background:var(--hover); }
    .rail-button:hover svg { transform:scale(1.08); }
    .rail-button:disabled { opacity:.4; cursor:default; transform:none; }
    .rail-new { background:var(--accent-soft); color:var(--accent-text); box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 30%,transparent); }
    .rail-directory.active { background:var(--hover); color:var(--text); }
    .rail-divider { width:24px; height:1px; background:var(--line); margin:5px 0; }
    .rail-pin { margin-top:auto; }
    @media (min-width:761px) {
      html[data-sidebar-collapsed="true"] .sidebar-rail { display:flex; flex-direction:column; align-items:center; gap:12px; padding:17px 9px; min-height:0; background:var(--sidebar); border-right:1px solid var(--line); }
      html[data-sidebar-collapsed="true"] #sidebar { position:fixed; z-index:8; left:72px; top:132px; width:274px; max-height:calc(100dvh - 156px); padding:18px 14px; border:1px solid var(--line); border-radius:22px; background:var(--paper); box-shadow:0 18px 50px #302b171c,0 4px 10px #302b1708; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .16s,visibility .16s; }
      html[data-sidebar-collapsed="true"][data-sidebar-peek="true"] #sidebar { opacity:1; visibility:visible; pointer-events:auto; transition:opacity .16s; }
      html[data-sidebar-collapsed="true"][data-sidebar-peek="true"] #sidebar > * { animation:sidebar-reveal .28s cubic-bezier(.2,1.25,.4,1); }
      @keyframes sidebar-reveal { from { transform:translateX(-4px); } to { transform:translateX(0); } }
      html[data-sidebar-collapsed="true"] #sidebar::before { content:""; position:absolute; top:0; bottom:0; left:-12px; width:12px; }
      html[data-sidebar-collapsed="true"] #sidebar .new-actions { margin-bottom:20px; }
      html[data-sidebar-collapsed="true"] #sidebar .note-search { margin:0 0 18px; flex:none; }
      html[data-sidebar-collapsed="true"] #sidebar .folder-root-drop { display:none; }
      html[data-sidebar-collapsed="true"] #sidebar .note-list { max-height:calc(100dvh - 420px); overflow:auto; }
      html[data-sidebar-collapsed="true"] #sidebar .server-footer { padding-top:14px; }
    }
    @media (prefers-reduced-motion:reduce) { .app,.rail-button,.rail-button svg,html[data-sidebar-collapsed="true"] #sidebar { transition:none; } html[data-sidebar-collapsed="true"][data-sidebar-peek="true"] #sidebar > * { animation:none; } .rail-button:hover svg { transform:none; } }
  </style>
</head>
<body>
  <div class="app" data-loading="true" aria-busy="true">
    <nav class="sidebar-rail" aria-label="收起的侧栏">
      <button class="rail-button rail-new" id="rail-new" type="button" data-note-action aria-label="新建笔记" title="新建笔记"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="rail-button" id="rail-search" type="button" data-note-action aria-label="搜索笔记" title="搜索笔记"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg></button>
      <span class="rail-divider"></span>
      <button class="rail-button rail-directory" id="rail-directory" type="button" data-note-action aria-label="笔记目录" aria-controls="sidebar" aria-expanded="false" title="笔记目录"><svg viewBox="0 0 24 24"><path d="M3 7V5h6l2 2h10v13H3Z"/></svg></button>
      <button class="rail-button rail-pin" id="rail-expand" type="button" aria-label="固定展开侧栏" title="固定展开侧栏"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m4-11 3 3-3 3"/></svg></button>
    </nav>
    <aside id="sidebar">
      <div class="new-actions"><button class="new-note" id="new-note" data-note-action><span class="plus">+</span><span>新建笔记</span></button><button class="icon-button" id="new-folder" data-note-action title="新建文件夹" aria-label="新建文件夹"></button></div>
      <input class="note-search" id="note-search" type="search" placeholder="搜索全部笔记" aria-label="搜索全部笔记" autocomplete="off">
      <div class="section-label" id="list-label" aria-live="polite">我的笔记</div>
      <div class="note-list" id="note-list"></div>
      <div class="empty-list" id="empty-list" hidden>还没有笔记，点上方按钮记下第一条。</div><div id="folder-root-drop" class="folder-root-drop">拖到这里，移出文件夹</div>
    </aside>
    <main>
      <header class="topbar">
        <button class="icon-button" id="sidebar-toggle" type="button" aria-label="收起侧栏" title="收起侧栏" aria-controls="sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-11-3 3 3 3"/></svg></button>
        <button class="icon-button mobile-menu" id="mobile-menu" data-note-action aria-label="笔记列表" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="crumb">简记 <span>/</span> <span id="crumb-title">新便签</span></div>
        <div class="actions">
          <button class="icon-button" id="share-note" data-note-action type="button" aria-label="分享笔记" title="分享笔记"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/></svg></button>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换到黑夜模式" title="切换到黑夜模式"></button>
          <span class="sr-only" id="save-state" role="status" aria-live="polite">未保存</span>
          <button class="save-button" id="save-note" data-note-action aria-label="保存" title="Ctrl+S / ⌘S 保存">保存</button>
        </div>
      </header>
      <div class="loading-panel" id="loading-panel" role="status" aria-live="polite"><span class="loading-orbit" aria-hidden="true"></span><span id="loading-message">正在加载笔记…</span><div class="loading-lines" aria-hidden="true"><i></i><i></i><i></i></div><button class="save-button" id="retry-load" hidden>重新加载</button></div>
      <section class="folder-locked-panel" id="folder-locked-panel" hidden><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><h2 id="locked-folder-name">文件夹已锁定</h2><p id="locked-folder-hint">重新输入密码后继续查看。</p><button class="save-button" id="unlock-active-folder">解锁并继续</button></section>
      <section class="editor-pane" id="editor-pane" inert aria-busy="true">
        <input class="title-input" id="title" placeholder="笔记标题" maxlength="200" aria-label="笔记标题">
        <div id="content"></div>
        <div hidden><button type="button" id="attach-image">选择图片</button><input id="image-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden></div>
      </section>
    </main>
  </div>
  <div class="note-menu" id="note-menu" role="menu" hidden>
    <button id="delete-note" role="menuitem" disabled>删除笔记</button>
  </div>
  <dialog class="unsaved-dialog share-dialog" id="share-dialog" aria-labelledby="share-heading">
    <header><h2 id="share-heading">分享笔记</h2><button class="icon-button" id="close-share" type="button" aria-label="关闭分享">×</button></header>
    <p>持有链接的人可只读查看分享时的内容。</p>
    <label class="share-field" for="share-days">有效期<select id="share-days"><option value="1">1 天</option><option value="2">2 天</option><option value="3">3 天</option><option value="4">4 天</option><option value="5">5 天</option><option value="6">6 天</option><option value="7">7 天</option></select></label>
    <div id="share-result" hidden><div class="share-link-row"><input id="share-link" aria-label="分享链接" readonly><button id="copy-share" type="button">复制链接</button></div><p id="share-expiry"></p></div>
    <p id="share-error" role="alert" hidden></p>
    <div class="dialog-actions"><button class="discard" id="revoke-share" type="button" hidden>取消分享</button><button class="primary" id="create-share" type="button">生成链接</button></div>
  </dialog>
  <div class="notice" id="notice" role="alert" hidden></div>
  <dialog class="unsaved-dialog" id="unsaved-dialog">
    <h2>有未保存的修改</h2>
    <p>保存后继续，或放弃这些修改。</p>
    <div class="dialog-actions">
      <button id="cancel-navigation">取消</button>
      <button class="discard" id="discard-changes">放弃修改</button>
      <button class="primary" id="save-and-continue">保存并继续</button>
    </div>
  </dialog>
  <dialog class="unsaved-dialog folder-dialog" id="folder-dialog" aria-labelledby="folder-heading"></dialog>
  <script src="/note-assets.js"></script>
  <script src="/folder-session.js"></script>
  <script src="/folders.js"></script>
  <script src="/editor.bundle.js"></script>
  <script src="/app.js"></script>
</body>
</html>
